<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM workspace test · sample data</title><link rel="stylesheet" href="../../js/sales-workspace.css?v=unified-1"><style>:root{--text:#24382e;--text-muted:#738277;--border:#dce5de;--bg-card:#fff;--accent:#25634c}*{box-sizing:border-box}body{margin:0;background:#fafcf9;color:#24382e;font-family:Arial,sans-serif}.preview-layout{display:flex;min-height:100vh}.preview-side{width:190px;flex-shrink:0;padding:25px 15px;background:#163e2e;color:#dce9df}.preview-side strong{font-size:18px}.preview-side p{font-size:11px;color:#a8c5b2}.preview-side div{padding:11px;border-radius:5px;font-size:12px;margin:4px 0}.preview-side .active{background:#285a42;color:#fff}.preview-main{padding:24px;flex:1;min-width:0}@media(max-width:760px){.preview-side{display:none}.preview-main{padding:14px}}</style></head><body><div style="background:#fff4dc;padding:8px 15px;font-size:11px">UI test fixture · fictional sample contacts · saves stay in this page and never reach the CRM</div><div class="preview-layout"><aside class="preview-side"><strong>Gabe Murfitt</strong><p>CLEAR · Speaking CRM</p><div class="active">Pipeline</div><div>Leads inbox</div><div>Activities</div><div>Mail & approvals</div><div>Reports</div></aside><main class="preview-main"><div id="root"></div></main></div><script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script><script src="../../js/command-model.js?v=unified-1"></script><script src="../../js/sales-model.js?v=unified-1"></script><script src="../../js/sales-workspace.js?v=unified-1"></script><script>
const h=React.createElement;
let fixtures=[
{id:'north',school:'Northview High School',contact:'Sarah Mitchell',email:'sarah@example.org',phone:'208-555-0100',city:'Boise',state:'ID',status:'In Discussion',followUp:'2026-10-27',fee:'',notes:'Interested in a spring leadership assembly.\nAsked about two student sessions.',contactConfidence:'VERIFIED',extraContacts:[{name:'Jordan Blake',role:'Activities director',email:'jordan@example.org'}],log:[{type:'Reply',date:'2026-10-24',note:'Interested in spring dates and pricing.'},{type:'Email sent',date:'2026-10-20',note:'Sent a school assembly introduction.',gmailThreadId:'test-thread'}],command:{source:'Referral',sales:{value:'3000'}}},
{id:'maple',school:'Maple Grove Middle School',contact:'Danielle Foster',email:'danielle@example.org',city:'Meridian',state:'ID',status:'In Discussion',followUp:'2026-10-30',command:{sales:{stage:'Pricing / Proposal',value:'2500'}}},
{id:'summit',school:'Summit Education Conference',type:'Conference',contact:'Marcus Lee',email:'marcus@example.org',status:'In Discussion',command:{sales:{stage:'Decision',value:'4000',activities:[{id:'a1',type:'meeting',subject:'Confirm audience and date',due:'2026-11-02',time:'10:00'}]}}},
{id:'river',school:'Riverside High School',contact:'Amy Bennett',email:'amy@example.org',status:'Emailed',command:{sales:{inPipeline:true,stage:'Contacted'}}},
{id:'cedar',school:'Cedar Hills School',contact:'Chris Morgan',email:'chris@example.org',status:'Not Started',command:{sales:{inPipeline:true,stage:'Qualified',value:'2200',activities:[{id:'a2',type:'call',subject:'Discuss assembly goals',due:'2026-10-29'}]}}},

const fake={from:()=>{const q={select:()=>q,eq:()=>q,order:()=>q,range:async()=>({data:[]})};return q;},rpc:async(name,args)=>{
 if(name!=='save_crm_sales_workspace')throw Error('Unexpected write');
 const c=fixtures.find(c=>c.id===args.record_id);const sales=c.command.sales||{};if((sales.revision||'0')!==args.expected_revision)return {error:{message:'This opportunity changed elsewhere. Reload it before saving; your edits are still here.'}};
 const p=args.payload;if(args.operation==='promote'){sales.inPipeline=true;sales.stage='Qualified';}
 if(args.operation==='stage'){sales.inPipeline=true;sales.stage=p.stage;if(p.stage==='Conversation'||p.stage==='Decision')c.status='In Discussion';if(p.stage==='Pricing / Proposal')c.status='Quote Sent';if(p.stage==='Deferred'){c.status='Try Next Year';c.followUp=p.due;}if(p.stage==='Won')c.status='Booked!';if(p.stage==='Lost')c.status='Not Interested';}
 if(args.operation.startsWith('activity_')){if(!sales.legacyImported&&c.followUp){sales.activities=[...(sales.activities||[]),{id:'legacy',subject:'Follow up',type:'email',due:c.followUp}];}sales.legacyImported=true;sales.activities=sales.activities||[];if(args.operation==='activity_add')sales.activities.push({...p,id:'test'+Date.now()});else sales.activities.find(a=>a.id===p.id).completedAt=new Date().toISOString();c.followUp=sales.activities.filter(a=>!a.completedAt).map(a=>a.due).sort()[0]||'';}
 if(args.operation==='note')sales.notes=[...(sales.notes||[]),{id:'note'+Date.now(),text:p.text,createdAt:new Date().toISOString()}];
 if(args.operation==='booking'){Object.assign(c.command,p);c.fee=p.fee;c.gigDate=p.eventDate;c.payStatus=p.paymentStatus;}if(args.operation==='reopen')c.status='In Discussion';if(args.operation==='details'){Object.assign(sales,p);c.command.potentialFee=p.value;}
 sales.revision=String(Date.now());c.command.sales=sales;window.fixtureCalls.push(args);return {data:JSON.parse(JSON.stringify(c))};}};
window.fixtureCalls=[];
ReactDOM.createRoot(document.getElementById('root')).render(h(window.SpeakingCommandCenter,{contacts:fixtures,client:fake,uid:'test',onOpenContact:()=>{},onUpdateContact:()=>{},onInquiries:()=>{}}));
