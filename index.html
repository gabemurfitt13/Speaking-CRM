      supabase.auth.getSession().then(function(sres){

          loadAndMount(sres.data.session.user);
        }

      resetPassBtn.disabled=false;resetPassBtn.textContent='Update Password';
    });

  async function loadAndMount(user){
    const notify=function(message){
      const el=document.getElementById('sync-status');
      if(el)el.textContent=message;
    };
    try{
      const persistence=CRMPersistence.create(supabase,localStorage,user.id,SEED,notify);
      const merged=await persistence.load();
      window._supabaseUser=user;
      window.crmPersistence=persistence;
      window.crmInitialContacts=merged;
      window.dispatchEvent(new CustomEvent('crm-synced',{detail:merged}));
      document.getElementById('login-wrap').style.display='none';
      if(window._syncInterval)clearInterval(window._syncInterval);
      window._syncInterval=setInterval(()=>persistence.flush(),30000);
      // Pull agent/background-driven updates (e.g. the scheduled email outreach
      // agent writing to Supabase directly) back into an already-open tab.
      const pullLatest=function(){
        persistence.load().then(function(c){window.dispatchEvent(new CustomEvent('crm-synced',{detail:c}));});
      };
      if(window._pullInterval)clearInterval(window._pullInterval);
      window._pullInterval=setInterval(pullLatest,45000);
      document.addEventListener('visibilitychange',function(){
        if(document.visibilityState==='visible')pullLatest();
      });
      window.addEventListener('beforeunload',function(e){
        if(persistence.hasPending()){e.preventDefault();e.returnValue='';}
      });
      window.addEventListener('online',()=>persistence.flush());
      persistence.flush();
    }catch(e){
      document.getElementById('login-err').textContent='Could not load cloud records. Your local data has not been replaced. Retry signing in. '+(e.message||'');
      const btn=document.getElementById('login-btn');btn.disabled=false;btn.textContent='Sign In';
    }
  }
});

function distanceFromMiddleton(c){
  const HOME_LAT=43.7068;
  const HOME_LNG=-116.6201;

  const lat=Number(c.lat);
  const lng=Number(c.lng);

  if(!lat || !lng || isNaN(lat) || isNaN(lng)) return 9999;

  const R=3958.8;
  const dLat=(lat-HOME_LAT)*Math.PI/180;
  const dLng=(lng-HOME_LNG)*Math.PI/180;

  const a=
    Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(HOME_LAT*Math.PI/180)*
    Math.cos(lat*Math.PI/180)*
    Math.sin(dLng/2)*Math.sin(dLng/2);

  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function getOutreachScore(c){
  let score=0;
  const miles=distanceFromMiddleton(c);

  // Distance from Middleton, ID is the main driver.
  if(miles<=15)score+=20000;
  else if(miles<=30)score+=18000;
  else if(miles<=50)score+=16000;
  else if(miles<=75)score+=14000;
  else if(miles<=100)score+=12000;
  else if(miles<=150)score+=10000;
  else if(miles<=250)score+=7500;
  else if(miles<=400)score+=5000;
  else if(miles<=700)score+=2500;
  else score+=500;

  // Manual priority can override distance when needed.
  if(c.manualScore && !isNaN(Number(c.manualScore))) score+=Number(c.manualScore)*1000;

  // Contact quality.
  if(c.contact && c.contact.trim())score+=1200;
  if(c.email && c.email.trim())score+=1600;

  if(c.contactConfidence==='VERIFIED')score+=2000;
  else if(c.contactConfidence==='LIKELY')score+=900;
  else if(c.contactConfidence==='FALLBACK')score+=300;

  // Larger schools usually have more budget and assembly infrastructure.
  if(c.cls==='6A')score+=900;
  else if(c.cls==='5A')score+=750;
  else if(c.cls==='4A')score+=550;
  else if(c.cls==='3A')score+=350;

  if(c.spokenBefore)score+=4000;

  // Stable tie-breaker favoring closer schools.
  score += Math.max(0,100-Math.min(100,Math.round(miles)));

  return Math.round(score);
}

function normalizeStatus(status){
  if(!status || status==='Not Contacted') return 'Not Started';

}

function cleanClassification(cls,state){
  const v=(cls||'').trim();
  const st=(state||'').trim().toUpperCase();
  const stateCodes=new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC']);
  if(stateCodes.has(v.toUpperCase()) || (st && v.toUpperCase()===st)) return '';
  return v;
}

function isReachedOut(c){

}

function exportData(contacts){
  const payload={version:1,exported:new Date().toISOString(),contacts};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`gabe-crm-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded','ti-download');
}

Gabe Murfitt

  };
  return templates[tplType]||templates.initial;
}

var _gmailTokenClient=null;
var _gmailAccessToken=null;
var _gmailOnConnectChange=null;

function getGmailTokenClient(){
  if(_gmailTokenClient)return _gmailTokenClient;
  _gmailTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:GMAIL_SEND_SCOPE,
    callback:function(resp){
      if(resp&&resp.access_token){
        _gmailAccessToken=resp.access_token;
        if(_gmailOnConnectChange)_gmailOnConnectChange(true);
      }
    },
    error_callback:function(){
      if(_gmailOnConnectChange)_gmailOnConnectChange(false);
    }
  });
  return _gmailTokenClient;
}

function connectGmail(){
  getGmailTokenClient().requestAccessToken({prompt:_gmailAccessToken?'':'consent'});
}

function isGmailConnected(){return !!_gmailAccessToken;}

function base64UrlEncode(str){
  var bytes=new TextEncoder().encode(str);
  var bin='';
  bytes.forEach(function(b){bin+=String.fromCharCode(b);});
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function sendGmailMessage(to,subject,body){
  return new Promise(function(resolve,reject){
    function doSend(){
      var mime='To: '+to+'\r\nSubject: '+subject+'\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n'+body;
      fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
        method:'POST',
        headers:{'Authorization':'Bearer '+_gmailAccessToken,'Content-Type':'application/json'},
        body:JSON.stringify({raw:base64UrlEncode(mime)})
      }).then(function(res){
        if(res.status===401){
          _gmailAccessToken=null;
          if(_gmailOnConnectChange)_gmailOnConnectChange(false);
          reject(new Error('Gmail connection expired. Click Connect Gmail and try again.'));
          return;
        }
        if(!res.ok){
          res.json().then(function(err){reject(new Error((err&&err.error&&err.error.message)||('Gmail API error '+res.status)));}).catch(function(){reject(new Error('Gmail API error '+res.status));});
          return;
        }
        res.json().then(resolve).catch(reject);
      }).catch(reject);
    }
    if(!_gmailAccessToken){reject(new Error('Not connected to Gmail yet.'));return;}
    doSend();
  });
}

      lon:f.lon===''?null:f.lon,
      lng:f.lon===''?null:f.lon
    };

    // Close the modal immediately so Save behaves like a normal form save.
    // Then update the record. This avoids React keeping the modal visible

    onUpdate(updated);

          <div className="form-field"><label>SCA Phone</label><input value={f.scaPhone} onChange={e=>u('scaPhone',e.target.value)} /></div>

          <div className="form-field"><label>Last Verified</label><input type="date" value={f.lastVerified} onChange={e=>u('lastVerified',e.target.value)} /></div>

          <div className="form-field"><label>Latitude</label><input value={f.lat} onChange={e=>u('lat',e.target.value)} placeholder="43.615"/></div>
          <div className="form-field"><label>Longitude</label><input value={f.lon} onChange={e=>u('lon',e.target.value)} placeholder="-116.202"/></div>
          <div className="form-field full"><label>Notes</label><textarea value={f.notes} onChange={e=>u('notes',e.target.value)} /></div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={save}><i className="ti ti-device-floppy"/> Save Changes</button>
        </div>
      </div>
    </div>
  );
}

function Pill({status}){
  const s=STATUS_CFG[status]||STATUS_CFG['Not Started'];
  return <span className="pill" style={{background:s.bg,color:s.color,borderColor:s.border}}>{status}</span>;
}
function PriBadge({p}){
  const cls=['pri-1','pri-2','pri-3','pri-4','pri-5'][(p||1)-1]||'pri-5';
  const lbl=['6A','5A','4A','3A','2A'][p-1]||'';
  return <span className={'pill '+cls} style={{fontSize:'10px'}}>{lbl}</span>;
}

function schoolContactKey(ct){
  return [(ct.name||'').trim().toLowerCase(),(ct.email||'').trim().toLowerCase()].join('|');
}
function schoolContacts(c,extras=c.extraContacts||[]){
  const primary=(c.contact||c.email)?{name:c.contact||'',role:c.role||'',phone:c.phone||'',email:c.email||'',contactConfidence:c.contactConfidence||'',contactSource:c.contactSource||'',lastVerified:c.lastVerified||'',kind:'main'}:null;
  const all=[primary,c.principal?{name:c.principal,role:'Principal',phone:c.pPhone||'',email:c.principalEmail||'',kind:'principal'}:null,c.sca?{name:c.sca,role:'SCA Advisor',phone:c.scaPhone||'',email:c.scaEmail||'',kind:'sca'}:null,...extras.map((ct,index)=>({...ct,kind:'extra',extraIndex:index}))].filter(Boolean);
  const seen=new Set();
  return all.filter(ct=>{const key=schoolContactKey(ct);if(seen.has(key))return false;seen.add(key);return true;});
}
function promoteSchoolContact(c,ct,extras=c.extraContacts||[]){
  if(ct.kind==='main')return c;
  const old=schoolContacts(c,extras).find(x=>x.kind==='main');
  const remaining=extras.filter((x,i)=>!(ct.kind==='extra'&&i===ct.extraIndex));
  const others=schoolContacts({...c,contact:'',email:''},remaining);
  if(old&&!others.some(x=>schoolContactKey(x)===schoolContactKey(old))){
    const {kind,extraIndex,...saved}=old;remaining.push(saved);
  }
  return {...c,contact:ct.name||'',role:ct.role||'',phone:ct.phone||'',email:ct.email||'',
    contactConfidence:ct.contactConfidence||ct.confidence||(ct.verified===true?'VERIFIED':''),
    contactSource:ct.contactSource||ct.source||'',lastVerified:ct.lastVerified||ct.verifiedAt||'',extraContacts:remaining};
}

      {(c.email||c.phone)&&<div style={{fontSize:12,color:'var(--text-muted)',marginTop:5,overflowWrap:'anywhere'}}>{[c.email,c.phone].filter(Boolean).join(' · ')}</div>}

function ProspectNotes({value,onChange}){
  const ref=useRef(null);
  React.useLayoutEffect(()=>{
    const el=ref.current;
    if(!el)return;
    function resize(){
      el.style.height='auto';
      el.style.height=el.scrollHeight+el.offsetHeight-el.clientHeight+'px';
    }
    resize();
    let width=el.getBoundingClientRect().width;
    const observer=new ResizeObserver(()=>{
      const nextWidth=el.getBoundingClientRect().width;
      if(nextWidth!==width){width=nextWidth;resize();}
    });
    observer.observe(el);
    return ()=>observer.disconnect();
  },[value]);
  return <textarea ref={ref} className="field-ta" style={{overflow:'hidden',resize:'none'}} value={value||''} onChange={onChange} placeholder="Add notes..."/>;
}

function DetailPanel({c,onUpdate,onClose}){
  const [tab,setTab]=useState('track');

  const [extraContacts,setExtraContacts]=useState(c.extraContacts||[]);
  const [newContact,setNewContact]=useState({name:'',role:'AD',phone:'',email:''});
  const [showAddContact,setShowAddContact]=useState(false);
  const [showEditSchool,setShowEditSchool]=useState(false);
  const [status,setStatus]=useState(c.status);
  const [fee,setFee]=useState(c.fee||'');
  const [expenses,setExpenses]=useState(c.expenses||'');
  const [students,setStudents]=useState(c.students||'');
  const [payStatus,setPayStatus]=useState(c.payStatus||'Not Invoiced');
  const [gigDate,setGigDate]=useState(c.gigDate||'');
  const [notes,setNotes]=useState(c.notes);
  const [followUp,setFollowUp]=useState(c.followUp||'');
  const [contacted,setContacted]=useState(c.contacted||'');
  const [logNote,setLogNote]=useState('');
  const [logType,setLogType]=useState('Call');
  const [tplType,setTplType]=useState('initial');
  const [copied,setCopied]=useState(false);
  const [sending,setSending]=useState(false);
  const [sent,setSent]=useState(false);
  const [sendErr,setSendErr]=useState('');

  useEffect(()=>{
    setStatus(c.status);setNotes(c.notes);
    setFollowUp(c.followUp||'');setContacted(c.contacted||'');
    setTab('track');setCopied(false);setShowEditSchool(false);
  },[c.id]);

  function save(){onUpdate({...c,status,notes,followUp,contacted,spokenBefore,fee,expenses,students,payStatus,gigDate,extraContacts});showToast('Changes recorded; check cloud save status');}
  function addLog(){
    if(!logNote.trim())return;
    const entry={date:CRMCommand.day(new Date()),type:logType,note:logNote.trim()};
    onUpdate({...c,status,notes,followUp,contacted,command:{...c.command,...({'Reply':{stage:'Replied'},'Sales conversation':{stage:'Conversation'},'Pricing request':{pricingRequested:true},'Proposal sent':{stage:'Pricing / Proposal',proposalSentOn:entry.date}}[logType]||{})},log:[entry,...(c.log||[])]});
    setLogNote('');showToast('Activity logged');
  }

  const [draft,setDraft]=useState(()=>buildEmailTemplate(c,'initial'));
  const tpl=draft;
  const st=STATUS_CFG[status]||STATUS_CFG['Not Started'];

  function copyEmail(){
    navigator.clipboard.writeText(`Subject: ${tpl.subject}\n\n${tpl.body}`).then(()=>{
      setCopied(true);showToast('Copied to clipboard','ti-clipboard-check');
      setTimeout(()=>setCopied(false),2000);
    });
  }
  function openMailto(){
    if(tplType==='followup'){setSendErr('Use Send via Gmail to preserve and verify the original conversation.');return;}
    const uri=`mailto:${c.email}?subject=${encodeURIComponent(tpl.subject)}&body=${encodeURIComponent(tpl.body)}`;
    window.open(uri);
  }
  function sendGmail(){
    if(!tpl.subject.trim()||!tpl.body.trim()){setSendErr('Enter a subject and message.');return;}
    if(/\[[^\]]*(?:here|insert|link)[^\]]*\]/i.test(tpl.body)){setSendErr('Replace the placeholder before sending.');return;}
    if(!window.confirm('Send this message to '+c.email+'?'))return;
    setSendErr('');setSending(true);
    if(tplType==='followup'){
      CRMThreadedFollowups.send({...c,status},tpl.body,_gmailAccessToken,supabase,window._supabaseUser?.id).then(async message=>{
        setSending(false);setSent(true);setFollowUp('');
        if(window.crmPersistence){const contacts=await window.crmPersistence.load();window.dispatchEvent(new CustomEvent('crm-synced',{detail:contacts}));}
        showToast('Follow-up sent in original Gmail conversation','ti-send');
      }).catch(err=>{setSending(false);setSendErr(err.message||'Follow-up held for review.');});
      return;
    }
    sendGmailMessage(c.email,tpl.subject,tpl.body).then((message)=>{
      setSending(false);setSent(true);
      const today=CRMCommand.day(new Date());
      const entry={date:today,type:'Email',activity:CRMCommand.emails(CRMCommand.normalize(c)).length?'follow_up':'first_contact',note:`Sent "${tpl.subject}" via Gmail`,gmailMessageId:message.id,gmailThreadId:message.threadId,timestamp:new Date().toISOString(),recipient:c.email};
      const advanceStatus=['Not Started','Left Voicemail'].includes(status);
      const newStatus=advanceStatus?'Emailed':status;
      const newFollowUp=(advanceStatus&&!followUp)?new Date(Date.now()+7*24*60*60*1000).toISOString().slice(0,10):followUp;
      if(advanceStatus)setStatus(newStatus);
      setContacted(today);
      setFollowUp(newFollowUp);
      onUpdate({...c,status:newStatus,notes,followUp:newFollowUp,contacted:today,log:[entry,...(c.log||[])]});
      showToast('Email sent via Gmail','ti-send');
      setTimeout(()=>setSent(false),2000);
    }).catch(err=>{
      setSending(false);setSendErr(err.message||'Failed to send.');
    });
  }

  return (
    <div className="detail-area">
      <div className="det-head">
        <div className="det-head-top">
          <h3>{c.school}</h3>
            <button className="btn sm" onClick={()=>setShowEditSchool(true)}><i className="ti ti-edit"/>Edit School</button>
          <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:11,color:'#92400e',fontWeight:600,background:'#fef3c7',padding:'3px 8px',borderRadius:4,border:'1px solid #fcd34d'}}><input type="checkbox" checked={spokenBefore} onChange={e=>{const v=e.target.checked;setSpokenBefore(v);onUpdate({...c,status,notes,followUp,contacted,spokenBefore:v,fee,expenses,students,payStatus,gigDate});}}/> [STAR] Spoken Here Before</label>
          <button className="btn sm" onClick={onClose}><i className="ti ti-x"/></button>
        </div>
        <div className="det-head-meta">

          <span className="badge">{c.district}</span>

              <i className="ti ti-mail"/> Open in Mail
            </button>}
            {c.email&&<button className="btn sm primary" style={{flex:1,justifyContent:'center'}} disabled={sending} onClick={isGmailConnected()?sendGmail:connectGmail}>
              <i className={'ti '+(sending?'ti-loader-2':sent?'ti-check':'ti-send')}/>{sending?'Sending...':sent?'Sent!':isGmailConnected()?'Send via Gmail':'Connect Gmail to Send'}
            </button>}
          </div>
          {!c.email&&<p style={{fontSize:11,color:'var(--text-muted)',marginTop:8,fontStyle:'italic'}}>Add email address in Contacts tab to enable sending.</p>}
          {sendErr&&<p style={{fontSize:11,color:'#dc2626',marginTop:8}}>{sendErr}</p>}
        </>}
      </div>
    </div>
  );
}

function MapView({contacts, onSelect, onUpdate}){
  var mapRef=useRef(null);
  var leafletMap=useRef(null);
  var markersRef=useRef([]);
  var markerByIdRef=useRef({});
  var [stateF,setStateF]=useState('ID');
  var [statusF,setStatusF]=useState('All');
  var [mapSearch,setMapSearch]=useState('');
  var [info,setInfo]=useState(null);

  var STATUS_COLORS={
    'Not Started':'#9ca3af','Left Voicemail':'#f59e0b','Emailed':'#3b82f6',
    'In Discussion':'#8b5cf6','Booked!':'#10b981','Not Interested':'#ef4444','Try Next Year':'#f97316'
  };

  useEffect(function(){
    if(!window.L||!mapRef.current) return;
    if(leafletMap.current){leafletMap.current.remove();leafletMap.current=null;}
    var map=window.L.map(mapRef.current).setView([44.0,-114.7],6);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors',maxZoom:18
    }).addTo(map);
    leafletMap.current=map;
    return function(){if(leafletMap.current){leafletMap.current.remove();leafletMap.current=null;}};
  },[]);

  useEffect(function(){
    if(!leafletMap.current||!window.L) return;
    if(info){
      var freshInfo=contacts.find(function(c){return c.id===info.id;});
      if(freshInfo&&freshInfo!==info) setInfo(freshInfo);
    }
    markersRef.current.forEach(function(m){m.remove();});
    markersRef.current=[];
    markerByIdRef.current={};

    var filtered=contacts.filter(function(c){
      if(!c.lat||!c.lon) return false;
      if(stateF!=='All'&&c.state!==stateF) return false;
      if(statusF!=='All'&&c.status!==statusF) return false;
      return true;
    });

    var bounds=[];
    filtered.forEach(function(c){
      bounds.push([c.lat,c.lon]);
      var color=c.spokenBefore?'#f59e0b':STATUS_COLORS[c.status]||'#9ca3af';
      var size=c.status==='Booked!'?14:c.spokenBefore?11:7;
      var border=c.status==='Booked!'?'3px solid #065f46':'2px solid #fff';
      var icon=window.L.divIcon({
        html:'<div style="width:'+size+'px;height:'+size+'px;background:'+color+';border-radius:50%;border:'+border+';box-shadow:0 1px 4px rgba(0,0,0,0.4);cursor:pointer;"></div>',
        className:'',iconSize:[size,size],iconAnchor:[size/2,size/2]
      });
      var marker=window.L.marker([c.lat,c.lon],{icon:icon}).addTo(leafletMap.current);
      marker.bindTooltip(c.school+'  -  '+c.city,{permanent:false,direction:'top',offset:[0,-6]});
      marker.on('click',function(){setInfo(c);});
      markersRef.current.push(marker);
      markerByIdRef.current[c.id]=marker;
    });

    if(bounds.length>0&&stateF!=='All'){
      try{leafletMap.current.fitBounds(bounds,{padding:[40,40],maxZoom:11});}catch(e){}
    }
  },[contacts,stateF,statusF]);

  var states=['All',...Array.from(new Set(contacts.filter(function(c){return c.lat;}).map(function(c){return c.state;}))).sort()];
  var mappedCount=contacts.filter(function(c){return c.lat&&(stateF==='All'||c.state===stateF)&&(statusF==='All'||c.status===statusF);}).length;
  var normalizedMapSearch=mapSearch.trim().toLowerCase();
  var mapSearchMatches=normalizedMapSearch?contacts.filter(function(c){
    if(!c.lat||!c.lon) return false;
    var hay=[c.school,c.city,c.district,c.contact,c.email,c.phone,c.state,c.type].join(' ').toLowerCase();
    return hay.indexOf(normalizedMapSearch)!==-1;
  }).slice(0,12):[];
  function focusMapSchool(match){
    if(!match||!leafletMap.current) return;
    setStateF(match.state||'All');
    setStatusF('All');
    setInfo(match);
    setMapSearch(match.school);
    setTimeout(function(){
      if(!leafletMap.current) return;
      leafletMap.current.setView([match.lat,match.lon],12);
      var marker=markerByIdRef.current[match.id];
      if(marker&&marker.openTooltip) marker.openTooltip();
    },80);
  }
  function runMapSearch(){
    var q=mapSearch.trim().toLowerCase();
    if(!q) return;
    var match=contacts.find(function(c){return c.lat&&c.lon&&c.school.toLowerCase()===q;})||
      contacts.find(function(c){
        if(!c.lat||!c.lon) return false;
        var hay=[c.school,c.city,c.district,c.contact,c.email,c.phone,c.state,c.type].join(' ').toLowerCase();
        return hay.indexOf(q)!==-1;
      });
    if(match) focusMapSchool(match);
    else showToast('No mapped school found','ti-search');
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="topbar" style={{flexShrink:0}}>
        <span className="topbar-title">Map View</span>
        <div className="srch-wrap" style={{maxWidth:300,position:'relative'}}>
          <i className="ti ti-search srch-icon"></i>
          <input className="srch" placeholder="Search map schools..." value={mapSearch} onChange={function(e){setMapSearch(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter') runMapSearch();}} />
          {mapSearchMatches.length>0&&mapSearch!==mapSearchMatches[0].school&&(
            <div style={{position:'absolute',top:36,left:0,right:0,zIndex:5000,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',maxHeight:240,overflowY:'auto'}}>
              {mapSearchMatches.map(function(c){return (
                <button key={c.id} onMouseDown={function(e){e.preventDefault();focusMapSchool(c);}} style={{display:'block',width:'100%',textAlign:'left',padding:'8px 10px',border:'none',borderBottom:'1px solid var(--border)',background:'transparent',cursor:'pointer',fontFamily:'inherit'}}>
                  <div style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{c.school}</div>
                  <div style={{fontSize:10.5,color:'var(--text-muted)'}}>{c.city}, {c.state} • {c.status}</div>
                </button>
              );})}
            </div>
          )}
        </div>
        <button className="btn sm" onClick={runMapSearch}><i className="ti ti-map-search"/> Find</button>
        <select className="sel" value={stateF} onChange={function(e){setStateF(e.target.value);}}>
          {states.map(function(s){return <option key={s}>{s}</option>;})}
        </select>
        <select className="sel" value={statusF} onChange={function(e){setStatusF(e.target.value);}}>
          {['All','Not Started','Left Voicemail','Emailed','In Discussion','Booked!','Not Interested','Try Next Year'].map(function(s){return <option key={s}>{s}</option>;})}
        </select>
        <span style={{fontSize:11,color:'var(--text-light)'}}>{mappedCount} schools</span>
      </div>
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        <div ref={mapRef} style={{flex:1}}/>
        {info&&(
          <div style={{width:260,borderLeft:'1px solid var(--border)',background:'var(--bg-card)',overflowY:'auto',padding:16,flexShrink:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:13,flex:1,paddingRight:8}}>{info.school}</div>
              <button onClick={function(){setInfo(null);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:18,lineHeight:1,padding:0}}>x</button>
            </div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6}}>{info.type}  -  {info.city}, {info.state}</div>
            {info.contact&&<div style={{fontSize:12,fontWeight:600,marginBottom:2}}>{info.contact}</div>}
            {info.phone&&<div style={{marginBottom:2}}><a href={'tel:'+info.phone} style={{fontSize:12,color:'var(--accent)'}}>{info.phone}</a></div>}
            {info.spokenBefore&&<div style={{fontSize:11,background:'#fef3c7',color:'#92400e',padding:'2px 8px',borderRadius:4,marginBottom:6,display:'inline-block'}}>\u2b50 Spoken Here</div>}
            <div style={{marginBottom:10}}>
              <span style={{fontSize:11,padding:'2px 8px',borderRadius:4,fontWeight:600,
                background:info.status==='Booked!'?'#f0fdf4':info.status==='Not Started'?'#f3f4f6':'#eff6ff',
                color:info.status==='Booked!'?'#166534':'#374151'}}>{info.status}</span>
            </div>
            {info.notes&&<div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10,fontStyle:'italic'}}>{info.notes.slice(0,80)}</div>}
            <div style={{borderTop:'1px solid var(--border)',paddingTop:10,marginTop:8,marginBottom:10}}>
              <label style={{display:'block',fontSize:10.5,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:0.4,marginBottom:4}}>Quick Status</label>
              <select className="status-sel" value={info.status} onChange={function(e){
                var updated={...info,status:e.target.value};
                setInfo(updated);
                onUpdate(updated);
                showToast('Status updated','ti-check');
              }}>
                {STATUSES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
              </select>
              <button className="btn" style={{width:'100%',marginTop:8,justifyContent:'center',background:info.spokenBefore?'#fef3c7':'var(--bg-card)',borderColor:info.spokenBefore?'#fcd34d':'var(--border)',color:info.spokenBefore?'#92400e':'var(--text)'}} onClick={function(){
                var updated={...info,spokenBefore:!info.spokenBefore};
                setInfo(updated);
                onUpdate(updated);
                showToast(updated.spokenBefore?'Marked as spoken here':'Removed spoken marker','ti-star');
              }}>
                <i className="ti ti-star"/> {info.spokenBefore?'Spoken Here: Yes':'Mark Spoken Here'}
              </button>
            </div>
            <button className="btn primary" style={{width:'100%'}} onClick={function(){var s=info;setInfo(null);onSelect(s);}}>Open Full Detail</button>
          </div>
        )}
      </div>
      <div style={{flexShrink:0,padding:'4px 12px',background:'var(--bg-card)',borderTop:'1px solid var(--border)',display:'flex',gap:16,fontSize:11,color:'var(--text-muted)',flexWrap:'wrap'}}>
        <span><span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:'#9ca3af',marginRight:4}}/>Not Started</span>
        <span><span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:'#3b82f6',marginRight:4}}/>Contacted</span>
        <span><span style={{display:'inline-block',width:11,height:11,borderRadius:'50%',background:'#10b981',marginRight:4}}/>Booked</span>
        <span><span style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:'#f59e0b',marginRight:4}}/>Spoken Before</span>
      </div>
    </div>
  );
}

function FinanceDashboard({contacts}){
  var booked=contacts.filter(function(c){return c.fee&&parseFloat(c.fee)>0;});
  var totalRev=booked.reduce(function(s,c){return s+parseFloat(c.fee||0);},0);
  var totalExp=booked.reduce(function(s,c){return s+parseFloat(c.expenses||0);},0);
  var totalNet=totalRev-totalExp;
  var totalStudents=booked.reduce(function(s,c){return s+parseFloat(c.students||0);},0);
  var avgFee=booked.length?totalRev/booked.length:0;
  var byState={};
  booked.forEach(function(c){
    if(!byState[c.state]) byState[c.state]={rev:0,count:0};
    byState[c.state].rev+=parseFloat(c.fee||0);
    byState[c.state].count+=1;
  });
  var stateList=Object.entries(byState).sort(function(a,b){return b[1].rev-a[1].rev;});
  var overdue=contacts.filter(function(c){return c.payStatus==='Overdue';});
  var invoiced=contacts.filter(function(c){return c.payStatus==='Invoiced';});
  function fmt(n){return '$'+Math.round(n).toLocaleString();}
  var stats=[
    {label:'Payments Received',val:fmt(booked.filter(c=>c.payStatus==='Received').reduce((sum,c)=>sum+parseFloat(c.fee||0),0)),color:'#166534',bg:'#f0fdf4'},
    {label:'Recorded Fees',val:fmt(totalRev),color:'#166534',bg:'#f0fdf4'},
    {label:'Total Expenses',val:fmt(totalExp),color:'#92400e',bg:'#fef3c7'},
    {label:'Fees Less Expenses',val:fmt(totalNet),color:'#1e40af',bg:'#eff6ff'},
    {label:'Gigs Logged',val:booked.length,color:'#374151',bg:'#f3f4f6'},
    {label:'Students Reached',val:Math.round(totalStudents).toLocaleString(),color:'#5b21b6',bg:'#f5f3ff'},
    {label:'Avg Fee',val:fmt(avgFee),color:'#374151',bg:'#f3f4f6'},
  ];
  return (
    <div style={{padding:16,overflowY:'auto',flex:1}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:20}}>
        {stats.map(function(s){return (
          <div key={s.label} style={{background:s.bg,borderRadius:10,padding:'12px 14px'}}>
            <div style={{fontSize:11,color:'#6b7280',marginBottom:4}}>{s.label}</div>
            <div style={{fontSize:20,fontWeight:800,color:s.color}}>{s.val}</div>
          </div>
        );})}
      </div>
      {overdue.length>0&&(
        <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
          <div style={{fontWeight:700,color:'#dc2626',marginBottom:6}}>Overdue: {overdue.length} payment{overdue.length>1?'s':''}</div>
          {overdue.map(function(c){return <div key={c.id} style={{fontSize:12,color:'#374151',padding:'2px 0'}}>{c.school} -- {fmt(parseFloat(c.fee||0))}</div>;})}
        </div>
      )}
      {invoiced.length>0&&(
        <div style={{background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
          <div style={{fontWeight:700,color:'#92400e',marginBottom:6}}>Pending: {invoiced.length} invoice{invoiced.length>1?'s':''}</div>
          {invoiced.map(function(c){return <div key={c.id} style={{fontSize:12,color:'#374151',padding:'2px 0'}}>{c.school} -- {fmt(parseFloat(c.fee||0))}</div>;})}
        </div>
      )}
      {stateList.length>0&&(
        <div>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Revenue by State</div>
          {stateList.map(function(item){
            var state=item[0]; var data=item[1];
            return (
              <div key={state} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,padding:'8px 12px',background:'#f9fafb',borderRadius:8}}>
                <div style={{width:30,fontWeight:700,fontSize:12}}>{state}</div>
                <div style={{flex:1,height:6,background:'#e5e7eb',borderRadius:3}}>
                  <div style={{height:'100%',width:(totalRev>0?data.rev/totalRev*100:0)+'%',background:'#2563eb',borderRadius:3}}/>
                </div>
                <div style={{fontSize:12,fontWeight:600,color:'#166534',width:65,textAlign:'right'}}>{fmt(data.rev)}</div>
                <div style={{fontSize:11,color:'#6b7280',width:55,textAlign:'right'}}>{data.count} gig{data.count>1?'s':''}</div>
              </div>
            );
          })}
        </div>
      )}
      {booked.length===0&&(
        <div style={{textAlign:'center',padding:40,color:'#6b7280'}}>
          <div style={{fontWeight:600,marginBottom:4}}>No financial data yet</div>
          <div style={{fontSize:13}}>Open a booked school, click the Finance tab, and log your fee.</div>
        </div>
      )}
    </div>
  );
}


function DistrictView({contacts,stateF,setStateF,setDistrictF,setView}){
  var districtMap={};
  contacts.filter(function(c){return stateF==='All'||c.state===stateF;}).forEach(function(c){
    var d=c.district||'Unknown District';
    if(!districtMap[d]) districtMap[d]={schools:[],state:c.state};
    districtMap[d].schools.push(c);
  });

                    <span style={{background:'var(--accent-bg)',color:'var(--accent)',borderRadius:4,padding:'2px 7px',fontSize:11,fontWeight:600}}>{contacted}/{total} contacted</span>

                  <div style={{height:'100%',width:pct+'%',background:booked>0?'#10b981':'var(--accent)',borderRadius:2}}/>

                <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
                  {schools.slice(0,6).map(function(s){return (
                    <span key={s.id} style={{fontSize:10,padding:'1px 6px',borderRadius:3,
                      background:s.status==='Booked!'?'#d1fae5':s.status!=='Not Started'?'#dbeafe':'var(--border)',

                      {s.school.replace(/ (High School|Middle School|Jr High|Elementary School|Elementary)$/,'')}
                    </span>
                  );})}
                  {total>6&&<span style={{fontSize:10,color:'var(--text-light)'}}>+{total-6} more</span>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}


function QueueView({contacts,onOpenContact}) {
  const today = new Date().toISOString().slice(0,10);

  const followUps = contacts
    .filter(c => c.followUp && c.followUp <= today && !['Booked!','Not Interested'].includes(c.status))
    .sort((a,b) => a.followUp > b.followUp ? 1 : -1);

  const hotLeads = contacts
    .filter(c => c.status === 'In Discussion')
    .sort((a,b) => relationshipScore(b) - relationshipScore(a));

  const untouched = contacts
    .filter(c => c.status === 'Not Started')
    .map(c => ({...c, outreachScore: getOutreachScore(c)}))
    .sort((a,b) => b.outreachScore - a.outreachScore)
    .slice(0,50);

  return (
    <div className="dash-wrap">
      <div className="stat-grid">
        <div className="stat-card fup">
          <div className="s-label">Follow-ups Due</div>
          <div className="s-num">{followUps.length}</div>
          <div className="s-sub">need action</div>
        </div>
        <div className="stat-card booked">
          <div className="s-label">Hot Leads</div>
          <div className="s-num">{hotLeads.length}</div>
          <div className="s-sub">high-value targets</div>
        </div>
        <div className="stat-card">
          <div className="s-label">Untouched</div>
          <div className="s-num">{contacts.filter(c=>c.status==='Not Started').length}</div>
          <div className="s-sub">not contacted yet</div>
        </div>
        <div className="stat-card">
          <div className="s-label">Booked</div>
          <div className="s-num">{contacts.filter(c=>c.status==='Booked!').length}</div>
          <div className="s-sub">wins</div>
        </div>
      </div>

      <div className="dash-section">
        <h3><i className="ti ti-bell"/> Follow-ups Due</h3>
        {followUps.length===0 ? (
          <div className="empty-state" style={{height:100}}>
            <p>No follow-ups due. Suspiciously peaceful.</p>
          </div>
        ) : followUps.map(c => (
          <QueueRow key={c.id} c={c} label={`Due: ${c.followUp}`} onOpenContact={onOpenContact}/>
        ))}
      </div>

      <div className="dash-section">
        <h3><i className="ti ti-flame"/> Hot Leads</h3>
        {hotLeads.length===0 ? (
          <div className="empty-state" style={{height:100}}>
            <p>No hot leads yet.</p>
          </div>
        ) : hotLeads.slice(0,25).map(c => (
          <QueueRow key={c.id} c={c} label={`Score: ${relationshipScore(c)}`} onOpenContact={onOpenContact}/>
        ))}
      </div>

      <div className="dash-section">
        <h3><i className="ti ti-mail-plus"/> Suggested First Outreach</h3>
        {untouched.length===0 ? (
          <div className="empty-state" style={{height:100}}>
            <p>No untouched schools. Disturbingly productive.</p>
          </div>
        ) : untouched.map(c => (
          <QueueRow key={c.id} c={c} label={`Score: ${c.outreachScore || 0}`} onOpenContact={onOpenContact}/>
        ))}
      </div>
    </div>
  );
}

function QueueRow({c,label,onOpenContact}) {
  return (
    <div className="fup-row" onClick={()=>onOpenContact(c)}>
      <div className="fup-row-left">
        <h4>
          {c.school}
          {c.spokenBefore&&<span style={{marginLeft:6,fontSize:9,background:'#fef3c7',color:'#92400e',border:'1px solid #fcd34d',borderRadius:3,padding:'1px 5px',fontWeight:700,verticalAlign:'middle'}}>[STAR] SPOKEN</span>}
        </h4>
        <p>{c.contact||'No contact on file'} - {c.city}{c.state?`, ${c.state}`:''} - {c.status}</p>
      </div>
      <span className="badge">{label}</span>
    </div>
  );
}

function relationshipScore(c) {
  let score = 0;
  if (c.spokenBefore) score += 50;
  if (c.status === 'Booked!') score += 40;
  if (c.status === 'In Discussion') score += 25;
  if (c.status === 'Emailed') score += 10;
  if (c.status === 'Left Voicemail') score += 8;
  if (c.followUp) score += 10;
  if (c.notes && c.notes.trim()) score += 5;
  if (c.email) score += 3;
  if (c.contact) score += 3;
  if (c.status === 'Not Interested') score -= 50;
  return score;
}

    const key=String(c.id);
    if(queueBusyIds[key])return;
    if(!window._supabaseUser?.id){alert('Sign in before updating the queue.');return;}
    setQueueBusyIds(v=>({...v,[key]:true}));
    try{
      const uid=window._supabaseUser.id;
      const {data:progress,error:progressError}=await supabase.from('progress').select('school_id,email,status,notes,last_verified,contact_confidence,contact_source,log').eq('user_id',uid).eq('school_id',key).maybeSingle();
      if(progressError)throw progressError;
      if(!progress)throw Error('This school has no saved CRM record. Save it before queueing.');
      const {data:existing,error:existingError}=await supabase.from('outreach_queue').select('*').eq('user_id',uid).eq('school_id',key).eq('kind',kind).maybeSingle();
      if(existingError)throw existingError;
      if(existing&&['sending','sent'].includes(existing.status))throw Error('This outreach is already sending or sent.');
      if(kind==='follow_up'&&!existing)throw Error('No prepared follow-up exists yet. Prepare and verify its original Gmail conversation in Command Center first.');
      if(checked&&kind==='initial'){
        if(!progress.email||!['high','verified'].includes(String(progress.contact_confidence||'').toLowerCase())||!progress.last_verified||!progress.contact_source)throw Error('Verify the main contact email and verification date before queueing.');
        if(String(progress.email).toLowerCase()!==String(c.email||'').toLowerCase())throw Error('The saved contact email differs from this card. Refresh before queueing.');
        if(/not interested|do not contact|booked|opt.?out|unsubscribe/i.test(String(progress.status||'')+' '+String(progress.notes||'')))throw Error('This prospect has a hold, opt-out or booking flag.');
        if(/contacted|emailed|follow.up|booked/i.test(String(progress.status||''))||(Array.isArray(progress.log)&&progress.log.some(x=>/sent|emailed/i.test(String(x.type||'')))))throw Error('Prior outreach is recorded. Initial outreach cannot be queued again.');
        if(!existing||!existing.approved_subject||!existing.approved_body){
          const firstName=String(c.contact||'').trim().split(' ')[0]||'there';
          const subject=existing?.approved_subject||'quick question';
          const body=existing?.approved_body||['Hi '+firstName+',','','Who is the best person to contact about booking a guest speaker at '+c.school+'?','','Thanks,','Gabe Murfitt','gabemurfitt.com'].join('\n');
          const payload={approved_subject:subject,approved_body:body,verified_email:progress.email,status:'held',hold_reason:'Review the draft before approval',updated_at:new Date().toISOString()};
          const request=existing?supabase.from('outreach_queue').update(payload).eq('id',existing.id).eq('user_id',uid).eq('status',existing.status):supabase.from('outreach_queue').insert({...payload,user_id:uid,school_id:key,kind:'initial'});
          const created=await request.select('*').maybeSingle();
          if(created.error)throw created.error;
          if(!created.data)throw Error('Queue item changed. Refresh and retry.');
          setSchoolQueue(v=>({...v,[key]:'held'}));
          window.crmQueueRequestedSchool=key;setView('dashboard');
          showToast('Review the draft, then save and mark ready.');
          return;
        }
        if(String(existing.verified_email||'').toLowerCase()!==String(progress.email).toLowerCase())throw Error('The approved draft recipient does not match the verified email.');
      }
      if(!existing)throw Error('Add this school to the Outreach Queue and review its draft first.');
      const {data:reviewed,error}=await supabase.rpc('review_outreach_queue',{queue_id:existing.id,expected_status:existing.status,reviewed_subject:existing.approved_subject,reviewed_body:existing.approved_body,reviewed_recipient:existing.verified_email,mark_ready:checked});
      const updated=Array.isArray(reviewed)?reviewed[0]:reviewed;
      if(error)throw error;
      if(!updated)throw Error('Queue item changed. Refresh and try again.');
      (kind==='follow_up'?setFollowupQueue:setSchoolQueue)(v=>({...v,[key]:updated.status}));showToast(checked?(updated.status==='scheduled'?'Approved for its scheduled date':'Approved and ready for the sending schedule'):'Outreach paused');
    }catch(e){alert('Queue update failed: '+(e.message||e));}
    finally{setQueueBusyIds(v=>({...v,[key]:false}));}

            </select>
            <select className="sel" value={districtF} onChange={e=>setDistrictF(e.target.value)}>
              {['All',...Array.from(new Set(contacts.filter(c=>stateF==='All'||c.state===stateF).map(c=>c.district).filter(Boolean))).sort()].map(d=><option key={d}>{d}</option>)}
            </select>
            <span style={{fontSize:11,color:'var(--text-light)',whiteSpace:'nowrap'}}>{filtered.length} schools</span>
            <button onClick={()=>setSpokenFilter(f=>!f)} style={{fontSize:11,padding:'3px 8px',borderRadius:4,border:'1px solid '+(spokenFilter?'#f59e0b':'var(--border)'),background:spokenFilter?'#fef3c7':'transparent',color:spokenFilter?'#92400e':'var(--text-muted)',cursor:'pointer',fontWeight:spokenFilter?600:400}}>[STAR] Spoken Here</button>
          </div>
          <div className="content">
            <div className="list-area">
              {filtered.length===0
                ?<div className="empty-state"><i className="ti ti-search"/><p>No schools match your filters.</p></div>
                :pageRecords(filtered,prospectPage).map(c=><React.Fragment key={c.id}>
                    {selected&&selected.id===c.id
                      ? <DetailPanel key={selected.id} c={selected} onUpdate={updateContact} onClose={()=>setSelected(null)}/>
                      : <ContactCard c={c} isActive={false} onClick={()=>setSelected(c)} queueStatus={schoolQueue[String(c.id)]||''} queueBusy={!!queueBusyIds[String(c.id)]} onToggleQueue={toggleSchoolQueue}/>}
                  </React.Fragment>)
              }
              {pageControls(filtered.length,prospectPage,setProspectPage)}
            </div>
          </div>
        </>}

        {view==='followups'&&<>
          <div className="topbar"><span className="topbar-title">Follow-ups</span><span style={{fontSize:11,color:'var(--text-light)'}}>{fupContacts.length} due</span></div>
          <div className="content">
            <div className="list-area">
              {fupContacts.length===0
                ?<div className="empty-state"><i className="ti ti-check"/><p>All clear  --  no follow-ups due!</p></div>
                :pageRecords(fupContacts,followupPage).map(c=><React.Fragment key={c.id}>
                    {selected&&selected.id===c.id
                      ? <DetailPanel key={selected.id} c={selected} onUpdate={updateContact} onClose={()=>setSelected(null)}/>
                      : <ContactCard c={c} isActive={false} onClick={()=>setSelected(c)} queueStatus={followupQueue[String(c.id)]||''} queueBusy={!!queueBusyIds[String(c.id)]} onToggleQueue={(contact,checked)=>toggleSchoolQueue(contact,checked,'follow_up')}/>}
                  </React.Fragment>)
              }
              {pageControls(fupContacts.length,followupPage,setFollowupPage)}
            </div>
          </div>
        </>}

        
        {view==='districts'&&<DistrictView contacts={contacts} stateF={stateF} setStateF={setStateF} setDistrictF={setDistrictF} setView={setView}/>}
        {view==='map'&&<MapView contacts={contacts} onUpdate={updateContact} onSelect={function(school){setSelected(school);setStateF(school.state||'All');setDistrictF('All');setTypeF('All');setStatusF('All');setSpokenFilter(false);setSearch(school.school||'');setView('contacts');window.setTimeout(function(){var el=document.getElementById('card-'+school.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},300);}}/> }
        {view==='finance'&&(
          <>
            <div className="topbar"><span className="topbar-title">Finance</span></div>
            <div className="content"><FinanceDashboard contacts={contacts}/></div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
