<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Speaking CRM · Gmail connection</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.js"></script>
<style>body{font:18px system-ui;background:#f4f7f5;color:#19392d;margin:0;padding:24px}main{max-width:620px;margin:30px auto;background:white;padding:28px;border-radius:16px}button,a{font:inherit}button{background:#226647;color:white;border:0;border-radius:8px;padding:14px 20px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}#status{white-space:pre-wrap}a{color:#226647}</style></head>
<body><main><h1>Connect Gmail for the CRM</h1><p>Connect <strong>gabemurfittspeaker@gmail.com</strong> so the CRM can securely access Gmail when the browser is closed.</p><p>This connection step sends no emails. Background sending still requires a verified worker deployment.</p><p id="status" role="status">Checking your CRM sign-in…</p><button id="connect" disabled>Connect speaking Gmail</button><p><a href="./">Back to Speaking CRM</a></p></main>
<script>
const db=window.supabase.createClient('https://hoyilsqwbdkbxismiatf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhveWlsc3F3YmRrYnhpc21pYXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTM4MjcsImV4cCI6MjA5NDY4OTgyN30.GaAjxWcfmdBCRkSkRuw3Ix1tDqoxNMCHOPWaY6VGg1c');
const endpoint='https://hoyilsqwbdkbxismiatf.supabase.co/functions/v1/gmail-oauth';
const status=document.getElementById('status'),button=document.getElementById('connect');
async function call(route){const {data,error}=await db.auth.getSession();if(error||!data.session)throw Error('Sign in to the Speaking CRM first, then return to this page.');const result=await fetch(endpoint+'/'+route,{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:'{}'});const value=await result.json();if(!result.ok)throw Error(value.message||value.error||'Connection request failed.');return value;}
async function refresh(){try{const value=await call('status');if(!value.configured){status.textContent='Google credentials are missing or the client ID does not match. Check GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Supabase Edge Function Secrets.';return;}status.textContent=value.connected?'Connected: '+value.mailbox+'\nAuthorized: '+new Date(value.connectedAt).toLocaleString()+'. This confirms authorization was saved; background sending is not enabled by this page.':'Google credentials are configured. Tap below and choose gabemurfittspeaker@gmail.com. Grant both Gmail read and send permissions.';button.textContent=value.connected?'Reconnect speaking Gmail':'Connect speaking Gmail';button.disabled=false;}catch(error){status.textContent=error.message;}}
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Opening Google authorization…';try{const value=await call('start');const url=new URL(value.authorizationUrl);if(url.origin!=='https://accounts.google.com')throw Error('Unexpected authorization destination.');window.location.assign(url.href);}catch(error){status.textContent=error.message;button.disabled=false;}});
refresh();
</script></body></html>
